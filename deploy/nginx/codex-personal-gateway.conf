server {
    listen 97.64.21.36:8443 ssl;
    server_name 97.64.21.36;

    ssl_certificate     /etc/letsencrypt/live/97.64.21.36/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/97.64.21.36/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CodexGatewayTLS:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    access_log off;
    client_max_body_size 16m;

    location = /v1 {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ~ ^/(?:v1/(?:models|responses(?:/compact)?|alpha/search)|backend-api/codex(?:/.*)?)$ {
        proxy_pass http://127.0.0.1:18317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
